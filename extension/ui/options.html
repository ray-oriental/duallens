<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DualLens 设置</title><link rel="stylesheet" href="ui.css"></head><body><main>
<header><img src="../icons/48.png" alt=""><div><h1>DualLens 双语对照翻译</h1><small>语言、模型与阅读方式，由你决定</small></div></header>
<form id="settings-form"><section><h2>阅读</h2><div class="grid">
<label>目标语言<select id="targetLang"></select></label><label>源语言<select id="sourceLang"></select></label><label>显示方式<select id="displayMode"><option value="bilingual">双语对照</option><option value="translation-only">仅显示译文</option></select></label><label>译文样式<select id="style"></select></label>
<label>最短段落字符数<input id="minChars" type="number" min="2" max="1000"></label><label>行内译文字符阈值<input id="inlineMaxChars" type="number" min="0" max="500"></label><label>视口预加载距离（px）<input id="rootMarginPx" type="number" min="0" max="3000"></label><label>合批等待（ms）<input id="batchDelayMs" type="number" min="10" max="2000"></label></div></section>
<section><h2>翻译接口</h2><p class="hint">默认使用交大 → Hermes 零价模型 → 本机 Ollama。Claude / Codex 订阅只在手动选择时调用，会消耗订阅额度，未设置每日上限。网页正文会发送到所选接口。</p><div class="grid">
<label>活动接口<select id="profile"></select></label><label>接口名称<input id="profileName" maxlength="100"></label><label class="wide">OpenAI 兼容地址（含 /v1）<input id="baseUrl" type="url" placeholder="http://127.0.0.1:18790/v1"></label><label class="wide" id="key-row">第三方 API key<input id="apiKey" type="password" autocomplete="off" spellcheck="false"><span class="hint">仅存浏览器本机，不进入导出文件；本机网关使用已有登录态。</span></label>
<label class="wide">模型<input id="model" list="models" autocomplete="off"><datalist id="models"></datalist></label><label class="wide">自动备选模型（每行一个）<textarea id="fallbackModels" class="mono"></textarea></label>
<label>每批段落上限<input id="maxItems" type="number" min="1" max="50"></label><label>每批字符上限<input id="maxChars" type="number" min="100" max="12000"></label><label>并发数<input id="concurrency" type="number" min="1" max="6"></label><label>请求超时（ms）<input id="timeoutMs" type="number" min="1000" max="300000"></label><label class="check"><input id="jsonMode" type="checkbox">使用 JSON 响应模式</label></div>
<div class="actions"><button id="load-models" type="button">获取模型列表</button><button id="test" type="button">翻译测试文本</button></div></section>
<section><h2>交互</h2><div class="grid"><label class="check"><input id="hoverEnabled" type="checkbox">悬停翻译</label><label>悬停修饰键<select id="hoverModifier"><option value="Shift">Shift</option><option value="Alt">Alt</option><option value="Control">Ctrl</option><option value="none">无需按键（停留500ms）</option></select></label>
<label class="check"><input id="selectionEnabled" type="checkbox">划词翻译</label><label class="check"><input id="showIcon" type="checkbox">划词后显示按钮</label><label class="check"><input id="inputEnabled" type="checkbox">输入框翻译</label><label>输入框目标语言<select id="inputLang"></select></label><label>输入触发方式<select id="inputTrigger"><option value="triple-space">三次空格或 Alt+I</option><option value="shortcut">仅 Alt+I</option></select></label><label class="check"><input id="prefixOverride" type="checkbox">允许 /ja 等前缀指定目标语言</label>
<label class="check"><input id="floatEnabled" type="checkbox">显示悬浮球</label><label>悬浮球侧边<select id="floatSide"><option value="right">右侧</option><option value="left">左侧</option></select></label></div><p class="hint">快捷键可在浏览器扩展快捷键页面修改：Alt+A 翻译或恢复，Alt+W 切换显示方式，Alt+I 翻译输入框。</p></section>
<section><h2>提示词与术语</h2><div class="grid"><label>翻译风格<select id="preset"><option value="general">通用</option><option value="tech">技术文档</option><option value="academic">学术</option><option value="news">新闻</option><option value="social">社交口语</option><option value="custom">自定义</option></select></label><label class="wide">自定义风格要求<textarea id="customPrompt" placeholder="仅在风格设为自定义时生效"></textarea></label><label class="wide">术语表<textarea id="glossary" placeholder="每行：原词 → 译词"></textarea></label></div></section>
<section><h2>站点规则</h2><p class="hint">每行填写域名或 *.example.com。“从不”优先于“总是”。</p><div class="grid"><label>总是翻译<textarea id="always" class="mono"></textarea></label><label>从不翻译<textarea id="never" class="mono"></textarea></label><label class="wide">这些源语言自动翻译<select id="autoLangs" multiple size="5"></select><span class="hint">Ctrl / Command 多选；未选择时仅按站点规则自动翻译。</span></label><label class="wide">自定义选择器规则（JSON 数组）<textarea id="customRules" class="mono" rows="6" placeholder='[{"match":"example.com","include":"article","exclude":".menu","style":"plain"}]'></textarea></label></div></section>
<section><h2>本机缓存与设置备份</h2><div class="grid"><label class="check"><input id="cacheEnabled" type="checkbox">缓存译文</label><label>缓存条数上限<input id="maxEntries" type="number" min="100" max="100000"></label><label>缓存有效天数<input id="ttlDays" type="number" min="1" max="365"></label><p id="cache-stats" class="status" aria-live="polite"></p></div><div class="actions"><button id="cache-clear" type="button">清空译文缓存</button><button id="export" type="button">导出设置（不含密钥）</button><button id="import-button" type="button">导入设置</button><input id="import-file" type="file" accept="application/json,.json" hidden></div><p class="hint">导入保留本机已有 API key。译文缓存只保存在浏览器本机；可随时清空。</p></section>
<div class="savebar"><div id="status" class="status" role="status" aria-live="polite"></div><button id="save" type="submit" class="primary">保存设置</button></div></form></main><script type="module" src="options.js"></script></body></html>
