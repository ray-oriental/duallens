<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DualLens PDF 双语阅读</title><link rel="stylesheet" href="viewer.css"></head>
<body data-view="side"><header translate="no"><div class="bar">
<div class="brand"><img src="../icons/32.png" alt=""><strong>DualLens PDF</strong></div>
<div class="controls"><button id="translate" class="primary" disabled>翻译</button><button id="restore" disabled>恢复原文</button>
<label>视图<select id="mode"><option value="side">双栏对照</option><option value="translated">仅译文页</option><option value="original">原文页</option><option value="reflow">重排阅读</option></select></label>
<label>缩放<select id="zoom"><option value="fit" selected>适合宽度</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
<label class="page-jump">页<input id="page-number" type="number" min="1" value="1" aria-label="页码"><span id="page-count">/ 0</span></label><button id="jump">跳转</button>
<label>主题<select id="theme"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
<button id="settings">模型设置</button><label class="file-button">选择本地 PDF<input id="local-file" type="file" accept="application/pdf,.pdf"></label></div></div>
<div class="info"><p id="status" role="status" aria-live="polite">正在打开 PDF…</p>
<p class="hint" id="privacy">本地解析；翻译前将说明实际发送去向。</p></div></header>
<main id="pdf-pages" aria-label="PDF 页面"></main><script type="module" src="viewer.js"></script></body></html>
