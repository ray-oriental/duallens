<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DualLens PDF 双语阅读</title><link rel="stylesheet" href="../styles/content.css"><link rel="stylesheet" href="viewer.css"></head>
<body><header translate="no"><div class="brand"><img src="../icons/32.png" alt=""><strong>DualLens PDF</strong><span>本地阅读 · 自选模型</span></div>
<div class="controls"><button id="translate" disabled>翻译附近段落</button><button id="restore" disabled>恢复原文</button>
<label>显示<select id="mode"><option value="bilingual">双语对照</option><option value="translation-only">仅译文</option></select></label>
<label>缩放<select id="zoom"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
<label>页码<input id="page-number" type="number" min="1" value="1"><span id="page-count">/ 0</span></label><button id="jump">跳转</button>
<label>主题<select id="theme"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
<button id="settings">模型设置</button><label class="file-button">选择本地 PDF<input id="local-file" type="file" accept="application/pdf,.pdf"></label></div>
<p id="status" role="status" aria-live="polite">正在打开 PDF…</p>
<p class="hint">PDF 在此设备解析；点击翻译后，附近段落发往你配置的模型服务。扫描件需先 OCR。本地 file:// 链接需在扩展详情页允许访问文件网址，也可直接选择文件。</p></header>
<main id="pdf-pages" aria-label="PDF 页面"></main><script type="module" src="viewer.js"></script></body></html>
