<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="pdfTitle"></title><link rel="stylesheet" href="../ui/tokens.css"><link rel="stylesheet" href="../ui/components.css"><link rel="stylesheet" href="viewer.css"></head>
<body data-view="side"><header translate="no"><div class="bar">
<strong class="brand">DualLens PDF</strong>
<div class="group"><button id="translate" class="primary" disabled data-i18n="m6v"></button><button id="restore" class="dl-text-button" disabled data-i18n="m2x"></button></div>
<div class="group">
<label class="pick"><span data-i18n="pdfView"></span><select id="mode"><option value="side" data-i18n="pdfSide"></option><option value="translated" data-i18n="pdfTranslated"></option><option value="original" data-i18n="pdfOriginal"></option><option value="reflow" data-i18n="pdfReflow"></option></select></label>
<label class="pick"><span data-i18n="pdfZoom"></span><select id="zoom"><option value="fit" selected data-i18n="pdfFit"></option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
<span class="page-jump"><label class="pick"><span data-i18n="pdfPage"></span><input id="page-number" type="number" min="1" value="1" data-i18n-aria-label="pdfPageNumber"></label><span id="page-count">/ 0</span><button id="jump" class="dl-text-button" data-i18n="pdfJump"></button></span>
</div>
<div class="group tools"><button id="export-pdf" class="dl-text-button" disabled aria-expanded="false" aria-controls="export-panel" data-i18n="pdfExportPDF"></button><button id="settings" class="dl-text-button" data-i18n="pdfSettings"></button><label class="file-button"><span data-i18n="pdfLocal"></span><input id="local-file" type="file" accept="application/pdf,.pdf"></label>
<label class="pick"><span data-i18n="pdfTheme"></span><select id="theme"><option value="auto" data-i18n="pdfAuto"></option><option value="light" data-i18n="pdfLight"></option><option value="dark" data-i18n="pdfDark"></option></select></label></div>
</div>
<div class="info"><p id="status" role="status" aria-live="polite" data-i18n="pdfOpening"></p><button id="ocr-toggle" class="dl-text-button" hidden aria-expanded="false" aria-controls="ocr-panel" data-i18n="pdfOCRTitle"></button>
<p class="hint" id="privacy" data-i18n="pdfPrivacy"></p></div>
<section id="export-panel" class="pdf-panel" hidden data-i18n-aria-label="pdfExportPDF">
<div class="fields"><label><span data-i18n="pdfExportLayout"></span><select id="export-layout"><option value="side" data-i18n="pdfSide"></option><option value="translated" data-i18n="pdfTranslated"></option></select></label>
<label><span data-i18n="pdfExportScope"></span><select id="export-scope"><option value="all" data-i18n="pdfExportAll"></option><option value="range" data-i18n="pdfExportRange"></option></select></label>
<label id="export-range-label" hidden><span data-i18n="pdfExportRange"></span><input id="export-range" type="text" placeholder="1-5, 8" autocomplete="off"></label></div>
<label id="export-long" class="check" hidden><input id="export-long-confirm" type="checkbox"><span data-i18n="pdfExportLong"></span></label>
<p class="hint" data-i18n="pdfExportHint"></p>
<div class="actions"><button id="export-start" data-i18n="pdfExportStart"></button><button id="export-cancel" class="dl-text-button" data-i18n="pdfExportCancel"></button><p id="export-status" class="progress" role="status" aria-live="polite"></p></div>
</section>
<section id="ocr-panel" class="pdf-panel" hidden data-i18n-aria-label="pdfOCRTitle">
<div class="fields"><label><span data-i18n="pdfOCRLanguage"></span><select id="ocr-language"><option value="eng" data-i18n="pdfOCREnglish"></option><option value="jpn" data-i18n="pdfOCRJapanese"></option><option value="kor" data-i18n="pdfOCRKorean"></option></select></label></div>
<p class="hint" data-i18n="pdfOCRHint"></p><p id="ocr-pack" class="hint"></p>
<label id="ocr-download-label" class="check" hidden><input id="ocr-download" type="checkbox"><span data-i18n="pdfOCRDownloadConfirm"></span></label>
<div class="actions"><button id="ocr-start" data-i18n="pdfOCRTitle"></button><button id="ocr-cancel" class="dl-text-button" hidden data-i18n="pdfExportCancel"></button><p id="ocr-status" class="progress" role="status" aria-live="polite"></p></div>
</section></header>
<main id="pdf-pages" data-i18n-aria-label="pdfPages"></main><script type="module" src="viewer.js"></script></body></html>
