<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DualLens fixture: dynamic</title>
<style>
  body { font: 16px/1.6 Georgia, serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 26px; }
</style>
</head>
<body>
<h1 id="h-dyn">Dynamic feed fixture</h1>
<p id="p-static">This first paragraph exists before any script runs, so it is always present in the page.</p>
<button id="nav-btn" type="button">Go to route two</button>
<div id="feed"></div>
<main id="app">
  <p id="app-initial">Initial route content that will be replaced by a history push.</p>
</main>
<script>
// Test fixture only. A timer appends paragraphs to #feed (simulating a live feed),
// and navigate() swaps #app's content with history.pushState (simulating an SPA route change).
(function () {
  var feed = document.getElementById('feed');
  var app = document.getElementById('app');
  var MAX = 6;
  var count = 0;

  function appendItem() {
    count += 1;
    var p = document.createElement('p');
    p.id = 'dyn-' + count;
    p.className = 'dyn';
    p.textContent = 'Timed item ' + count + ' was appended by a timer, which simulates a live feed update.';
    feed.appendChild(p);
    return p;
  }

  var timer = setInterval(function () {
    appendItem();
    if (count >= MAX) clearInterval(timer);
  }, 800);

  function navigate(route) {
    history.pushState({ route: route }, '', '/spa/' + route);
    app.innerHTML = '';
    [1, 2, 3].forEach(function (i) {
      var p = document.createElement('p');
      p.id = 'spa-' + route + '-' + i;
      p.className = 'spa';
      p.textContent = 'Route ' + route + ' paragraph ' + i + ' arrived after a client side navigation.';
      app.appendChild(p);
    });
  }

  document.getElementById('nav-btn').addEventListener('click', function () {
    navigate('route-2');
  });

  window.__dlFixture = {
    navigate: navigate,
    appendItem: appendItem,
    count: function () { return count; }
  };
})();
</script>
</body>
</html>
